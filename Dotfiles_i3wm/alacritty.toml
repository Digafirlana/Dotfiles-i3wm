[env]
TERM = "alacritty"
[window]
padding = { x = 5, y = 5 }

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11.0


[cursor.style]
shape = "Underline"
blinking = "On"

[colors.primary]
background = '#0a0b10' # Hitam kebiruan sangat gelap
foreground = '#e0f7ff'

[colors.cursor]
text = "#1C1C1C"
cursor = "#5c9eff"

[colors.selection]
text = "#FFFFFF"
background = "#5c9eff"

shape = "Underline"
blinking = "On"

