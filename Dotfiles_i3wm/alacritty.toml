[colors.normal]
black   = "#000000"
red     = "#5c9eff"
green   = "#AAAAAA"
yellow  = "#EEEEEE"
blue    = "#5c9eff"
magenta = "#F92672"
cyan    = "#DDDDDD"
white   = "#FFFFFF"
