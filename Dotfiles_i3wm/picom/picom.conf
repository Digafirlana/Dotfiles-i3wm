backend = "glx"
vsync = true;
animations = (
    {
        # --- Animasi Buka Jendela (Gaya Hyprland Pop) ---
        triggers = ["open", "show"];
        opacity = {
            curve = "linear";
            duration = 0.15;
            start = 0;
            end = "window-raw-opacity";
        };
        scale-x = {
            # Kurva ini memberikan efek 'bounce' / overshoot
            curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)"; 
            duration = 0.3;
            start = 0.7; # Mulai dari lebih kecil agar efek pop terasa
            end = 1;
        };
        scale-y = "scale-x";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
    },
    {
        # --- Animasi Tutup Jendela (Gaya Hyprland Shrink) ---
        triggers = ["close", "hide"];
        opacity = {
            curve = "linear";
            duration = 0.2;
            start = "window-raw-opacity-before";
            end = 0;
        };
        scale-x = {
            curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
            duration = 0.2;
            start = 1;
            end = 0.8;
        };
        scale-y = "scale-x";
        blur-opacity = 0;
    },
    {
        # --- Animasi Workspace (Gaya Hyprland Slide horizontal) ---
        triggers = ["workspace-in"];
        offset-x = {
            curve = "cubic-bezier(0.25, 0.1, 0.25, 1)"; # Slide-out yang sangat smooth
            duration = 0.5;
            start = "window-width / 2 * -1";
            end = 0;
        };
        opacity = {
            duration = 0.3;
            start = 0;
            end = "window-raw-opacity";
        };
    },
    {
        triggers = ["workspace-out"];
        offset-x = {
            curve = "cubic-bezier(0.1, 1, 0.1, 1)";
            duration = 0.4;
            start = 0;
            end = "window-width / 2";
        };
        opacity = 0;
    },
    {
        # --- Animasi Perubahan Ukuran/Geometry ---
        triggers = ["geometry"];
        preset = "geometry-change";
        duration = 0.25;
        curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
    }
)
